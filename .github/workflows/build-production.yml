name: Build production artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
      - 'server.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm run build:server

      - name: Commit production artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist server.js
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "chore: update production artifacts [skip ci]"
          git push
