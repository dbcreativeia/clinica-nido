name: CRM regression checks
on:
  push:
    branches: [main, 'fix/crm-persistence-sync-20261031', 'fix/meta-signal-quality-20261031']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: node --test crm-sync.test.mjs meta-capi.test.mjs meta-conversions.test.ts meta-safety.test.ts analytics-engine.test.mjs
      - run: node --check server.ts
      - run: npm run lint
      - run: npm run build
